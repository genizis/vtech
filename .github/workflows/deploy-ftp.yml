name: Deploy FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Enviar para HostGator
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Validar secrets obrigatorios
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || { echo "Secret FTP_SERVER nao configurado"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Secret FTP_USERNAME nao configurado"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Secret FTP_PASSWORD nao configurado"; exit 1; }

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            img/imagem_usuario/**
            img/imagem_empresa/**
            application/logs/**
