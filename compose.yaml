services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vtech-php
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: percona:5.7.44
    container_name: vtech-percona
    restart: unless-stopped
    command:
      - "--character-set-server=utf8"
      - "--collation-server=utf8_general_ci"
      - "--sql-mode=NO_AUTO_VALUE_ON_ZERO,NO_ENGINE_SUBSTITUTION"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE:-vtech}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - percona_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  percona_data:
